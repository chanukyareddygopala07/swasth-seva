services:
  - type: web
    name: swasth-seva-backend
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    pythonVersion: 3.12.4
    buildCommand: pip install -r requirements.txt
    startCommand: sh -c "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: swasth-seva-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: swasth-seva-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: BACKEND_CORS_ORIGINS
        value: "*"
      - key: SEED_DEMO_DATA
        value: "true"
      - key: SUPER_ADMIN_PASSWORD
        value: SuperAdmin@123
      - key: AI_MODEL_DIR
        value: ai_models

  - type: web
    name: swasth-seva-frontend
    runtime: static
    rootDir: frontend
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    staticPublishPath: out
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://swasth-seva-backend.onrender.com/api/v1
      - key: NEXT_PUBLIC_WS_URL
        value: wss://swasth-seva-backend.onrender.com/ws
      - key: NEXT_PUBLIC_APP_NAME
        value: Swasth Seva

databases:
  - name: swasth-seva-db
    plan: free
    databaseName: swasthseva
    user: swasth

redis:
  - name: swasth-seva-redis
    plan: free
    maxmemoryPolicy: noeviction