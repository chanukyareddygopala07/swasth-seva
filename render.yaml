services:
  - type: web
    name: swasth-seva-backend
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: swasth-seva-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: swasth-seva-redis
          type: keyvalue
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: BACKEND_CORS_ORIGINS
        value: "*"
      - key: SEED_DEMO_DATA
        value: "true"
      - key: SUPER_ADMIN_PASSWORD
        value: SuperAdmin@123
      - key: AI_MODEL_DIR
        value: ai_models

  - type: web
    name: swasth-seva-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: out
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://swasth-seva-backend.onrender.com/api/v1
      - key: NEXT_PUBLIC_WS_URL
        value: wss://swasth-seva-backend.onrender.com/ws
      - key: NEXT_PUBLIC_APP_NAME
        value: Swasth Seva

  - type: keyvalue
    name: swasth-seva-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction

databases:
  - name: swasth-seva-db
    plan: free
    databaseName: swasthseva
    user: swasth